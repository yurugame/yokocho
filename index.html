<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<title>ゆるゲーム横丁</title>
<style>
  :root{
    --bg:#160f26;
    --bg2:#1e1436;
    --card:#241a3e;
    --ink:#f4eefb;
    --dim:#a99cc9;
    --pink:#ff5d8f;
    --yellow:#ffd23f;
    --cyan:#3fd8e0;
    --lime:#9be04b;
    --purple:#a06bff;
    --orange:#ff8a3d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Trebuchet MS","Hiragino Maru Gothic ProN",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;overflow-x:hidden}

  /* animated confetti dots background */
  .bgdots{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.5}
  .bgdots span{position:absolute;width:10px;height:10px;border-radius:3px;opacity:.6;
    animation:drift linear infinite}
  @keyframes drift{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(110dvh) rotate(360deg)}}

  .page{position:relative;z-index:1;max-width:560px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 26px) 18px 40px}

  header{text-align:center;margin-bottom:8px}
  .kicker{display:inline-block;font-size:12px;letter-spacing:.22em;color:var(--yellow);
    font-weight:bold;text-transform:uppercase;margin-bottom:10px}
  h1{font-size:clamp(34px,11vw,52px);line-height:1;font-weight:900;letter-spacing:-.02em}
  h1 .a{color:var(--pink)} h1 .b{color:var(--cyan)} h1 .c{color:var(--lime)}
  .tagline{color:var(--dim);font-size:14px;margin-top:12px;line-height:1.6}
  .count{margin:18px auto 26px;display:inline-flex;align-items:center;gap:8px;
    background:var(--bg2);border:1px solid #33254f;border-radius:999px;padding:8px 16px;font-size:13px;color:var(--dim)}
  .count b{color:var(--yellow);font-size:16px}

  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:440px){ .grid{grid-template-columns:1fr 1fr} }

  .card{position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--card);border-radius:20px;padding:18px 16px 16px;overflow:hidden;
    border:1px solid #322350;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 6px 0 #120b22}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 #120b22}
  .card .icon{font-size:40px;line-height:1;display:block;margin-bottom:12px;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .card h2{font-size:18px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em}
  .card p{font-size:12.5px;color:var(--dim);line-height:1.5}
  .card .tag{position:absolute;top:14px;right:14px;font-size:10px;font-weight:bold;
    letter-spacing:.04em;padding:4px 8px;border-radius:999px;color:#160f26}
  .card .go{margin-top:12px;font-size:12px;font-weight:bold;color:var(--ink);
    display:inline-flex;align-items:center;gap:5px;opacity:.85}
  .card .go .arrow{transition:transform .15s}
  .card:active .go .arrow{transform:translateX(3px)}
  /* left accent stripe, colored per card */
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,#fff)}

  footer{text-align:center;margin-top:34px;color:var(--dim);font-size:12px;line-height:1.7}
  footer .heart{color:var(--pink)}

  @media (prefers-reduced-motion: reduce){
    .bgdots span{animation:none;display:none}
    .card{transition:none}
  }
</style>
</head>
<body>
<div class="bgdots" id="dots"></div>
<div class="page">
  <header>
    <span class="kicker">ぜんぶ手作り・10本立て</span>
    <h1><span class="a">ゆる</span><span class="b">ゲーム</span><span class="c">横丁</span></h1>
    <p class="tagline">ちょっと理不尽で、ちょっと煽ってくる。<br>ヒマつぶし専用のミニゲーム詰め合わせ。</p>
    <div class="count">収録ゲーム <b>10</b> 本</div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    タップして好きなゲームを選んでね。<br>
    ぜんぶオフラインでも動くよ（※クレーン積み上げだけ通信が必要）<br>
    <span class="heart">♥</span> made for fun
  </footer>
</div>

<script>
const GAMES=[
  {file:'games/mouse-escape.html',   icon:'🐭', title:'チーズへの道',       desc:'猫から逃げてチーズへ。囮で気をそらせ。道は毎回変わる。', tag:'迷路', color:'#ffd23f'},
  {file:'games/memory-triples.html', icon:'🃏', title:'3枚そろえ神経衰弱',   desc:'同じ絵柄を3枚めくる。当たっても外しても煽られる。',       tag:'記憶', color:'#ff5d8f'},
  {file:'games/tap-rush.html',       icon:'⚡', title:'2秒連打',            desc:'2秒で何回タップできる？指の速さの限界に挑戦。',           tag:'連打', color:'#3fd8e0'},
  {file:'games/reflex-game.html',    icon:'🟢', title:'反射神経',           desc:'緑になった瞬間にタップ。早すぎるとやり直し。',             tag:'反射', color:'#9be04b'},
  {file:'games/crane-stack.html',    icon:'🏗️', title:'クレーン積み上げ',    desc:'動物を落として赤い線まで積む物理パズル。',                 tag:'物理', color:'#ff8a3d'},
  {file:'games/youtuber-run.html',   icon:'🎥', title:'登録者100人チャレンジ', desc:'良いセリフだけ言って登録者を増やせ。失言は炎上。',        tag:'避け', color:'#a06bff'},
  {file:'games/annoying-quiz.html',  icon:'❓', title:'ムカつく三択クイズ',   desc:'選択肢が逃げる。正解しても外しても煽られる引っ掛け。',     tag:'クイズ', color:'#ff5d8f'},
  {file:'games/cake-tap.html',       icon:'🍰', title:'ケーキタップ',        desc:'投げ上がるケーキをタップ。赤い肉ケーキに注意。',           tag:'反射', color:'#ffd23f'},
  {file:'games/fruit-basket.html',   icon:'🧺', title:'フルーツキャッチ',     desc:'落ちるフルーツを口でキャッチ。食べてる間は動けない。',     tag:'避け', color:'#9be04b'},
  {file:'games/escape-annoying.html',icon:'🚪', title:'脱出ゲーム（邪魔あり）', desc:'謎を解いて脱出。関係ない通知がしつこく割り込む。',        tag:'脱出', color:'#3fd8e0'},
];

const grid=document.getElementById('grid');
grid.innerHTML=GAMES.map(g=>`
  <a class="card" href="${g.file}" style="--accent:${g.color}">
    <span class="tag" style="background:${g.color}">${g.tag}</span>
    <span class="icon">${g.icon}</span>
    <h2>${g.title}</h2>
    <p>${g.desc}</p>
    <span class="go">あそぶ <span class="arrow">→</span></span>
  </a>`).join('');

// confetti background
const dots=document.getElementById('dots');
const colors=['#ff5d8f','#ffd23f','#3fd8e0','#9be04b','#a06bff','#ff8a3d'];
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  for(let i=0;i<18;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.background=colors[i%colors.length];
    s.style.animationDuration=(6+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*10)+'s';
    s.style.transform='scale('+(0.6+Math.random()*0.9)+')';
    dots.appendChild(s);
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>フルーツキャッチ</title>
<style>
  :root{ --sky:#f6fbf4; --sky2:#dcecdd; }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#1c2a1f;color:#243026;
    font-family:"Trebuchet MS","Hiragino Maru Gothic ProN",sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;padding:14px}
  .wrap{width:min(96vw,620px)}
  .top{display:flex;justify-content:space-between;align-items:baseline;color:#eaf3ec;margin-bottom:6px}
  h1{font-size:19px;letter-spacing:.04em;color:#ffd36e}
  .sub{color:#9fb3a3;font-size:11px;margin-bottom:8px}
  .hud{display:flex;justify-content:space-between;color:#eaf3ec;font-size:13px;margin-bottom:8px}
  .hud b{font-size:20px;color:#ffd36e}.hud .t b{color:#eaf3ec}
  canvas{width:100%;display:block;border-radius:14px;background:linear-gradient(var(--sky),var(--sky2));
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .controls{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font-family:inherit;font-weight:bold;border:none;border-radius:12px;padding:20px 0;
    font-size:20px;color:#243026;background:#cfe3d1;cursor:pointer;transition:transform .05s,background .12s}
  button:active{transform:scale(.96)}
  button.armed{background:#ffd36e}
  .startbtn{grid-column:1/-1;background:#e2683c;color:#fff;padding:16px 0;font-size:17px}
  .restart{grid-column:1/-1;background:#e2683c;color:#fff;padding:16px 0;font-size:17px;display:none}
  .restart.show{display:block}
  .msg{text-align:center;color:#eaf3ec;min-height:20px;margin-top:12px;font-size:15px}
  .msg.win{color:#ffd36e;font-size:17px}
</style>
</head>
<body>
<a href="../index.html" class="__backlink" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(0,0,0,.55);color:#fff;font-family:sans-serif;font-size:13px;font-weight:bold;text-decoration:none;padding:8px 12px;border-radius:20px">&#8592; 一覧</a>
<div class="wrap">
  <div class="top"><h1>フルーツキャッチ</h1></div>
  <div class="sub">上からいっぱい落ちてくるフルーツを口でキャッチ！ 食べてる間（もぐもぐ）は動けない。高価なフルーツは2点。3分勝負。</div>
  <div class="hud">
    <span>スコア <b id="score">0</b></span>
    <span class="t">のこり <b id="time">3:00</b></span>
  </div>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="left">◀ 左へ</button>
    <button id="right">右へ ▶</button>
    <button class="startbtn" id="start">スタート</button>
    <button class="restart" id="restart">もう一回</button>
  </div>
  <div class="msg" id="msg">「スタート」で開始</div>
</div>
<script>
const cv=document.getElementById('c');
const W=600,H=680; cv.width=W; cv.height=H;
const ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const msgEl=document.getElementById('msg');
const startBtn=document.getElementById('start');
const restartBtn=document.getElementById('restart');
const leftBtn=document.getElementById('left');
const rightBtn=document.getElementById('right');

const TIME_LIMIT=180;
const EAT_TIME=800;        // chewing lock after a catch (can't move)
const GRAV=0.34;
const BASKET_Y=H-56;
const BASKET_W=104;

const FRUITS=[
  {e:'🍎',p:1,w:5,r:16}, {e:'🍊',p:1,w:5,r:16}, {e:'🍐',p:1,w:4,r:17},
  {e:'🍌',p:1,w:4,r:18}, {e:'🍉',p:1,w:3,r:20}, {e:'🍓',p:1,w:4,r:13},
  {e:'🍒',p:1,w:4,r:14}, {e:'🍊',p:1,w:4,r:16},
  {e:'🍑',p:2,w:2,r:16}, {e:'🍇',p:2,w:2,r:16}, {e:'🍈',p:2,w:2,r:19},
  {e:'🍍',p:2,w:1,r:20}, {e:'🥭',p:2,w:1,r:18}, {e:'🥝',p:2,w:1,r:15},
];
const WSUM=FRUITS.reduce((a,f)=>a+f.w,0);

let basket={x:W/2}, fruits=[], score=0, timeLeft=TIME_LIMIT, running=false;
let timerId, lastFrame, raf=null, spawnT=0, moveDir=0, eatT=0;
let floats=[];

function reset(){
  basket={x:W/2}; fruits=[]; score=0; timeLeft=TIME_LIMIT; running=true;
  spawnT=400; moveDir=0; eatT=0; floats=[];
  scoreEl.textContent=0; setTime();
  msgEl.textContent='左右で移動。もぐもぐ中は動けない！';
  startBtn.style.display='none'; restartBtn.classList.remove('show');
  leftBtn.classList.remove('armed'); rightBtn.classList.remove('armed');
  clearInterval(timerId);
  timerId=setInterval(()=>{ if(!running)return; timeLeft--; setTime();
    if(timeLeft<=0) end(); },1000);
  lastFrame=performance.now();
  if(!raf) raf=requestAnimationFrame(loop);
}

function setTime(){ const m=Math.floor(timeLeft/60),s=timeLeft%60; timeEl.textContent=m+':'+String(s).padStart(2,'0'); }

function pickFruit(){ let r=Math.random()*WSUM; for(const f of FRUITS){ if((r-=f.w)<=0) return f; } return FRUITS[0]; }

function spawn(){
  const f=pickFruit();
  const x=f.r+8+Math.random()*(W-(f.r+8)*2);
  fruits.push({
    f, x, y:-f.r,
    vy:1.6+Math.random()*1.6,          // varied fall speed
    vx:(Math.random()-0.5)*1.0,        // slight drift
    rot:0, vr:(Math.random()-0.5)*0.28
  });
}

function requestMove(dir){
  if(!running) return;
  moveDir=dir;
  leftBtn.classList.toggle('armed', dir<0);
  rightBtn.classList.toggle('armed', dir>0);
}
function stopMove(){ moveDir=0; leftBtn.classList.remove('armed'); rightBtn.classList.remove('armed'); }

function loop(now){
  const dt=Math.min(40, now-(lastFrame||now)); lastFrame=now;
  const k=dt/16.67;
  if(running){
    // chewing lock
    if(eatT>0){ eatT-=dt; }
    else if(moveDir!==0){ basket.x+=moveDir*5.0*k; }
    basket.x=Math.max(BASKET_W/2, Math.min(W-BASKET_W/2, basket.x));

    // spawn many fruits over time (rate ramps up)
    spawnT-=dt;
    if(spawnT<=0){
      spawn();
      if(Math.random()<0.35) spawn(); // sometimes two at once
      spawnT=Math.max(260, 720 - (TIME_LIMIT-timeLeft)*1.4);
    }

    // physics + catch
    for(const o of fruits){
      o.vy+=GRAV*k*0.25; o.y+=o.vy*k; o.x+=o.vx*k; o.rot+=o.vr*k;
      if(o.x<o.f.r){ o.x=o.f.r; o.vx=Math.abs(o.vx); }
      if(o.x>W-o.f.r){ o.x=W-o.f.r; o.vx=-Math.abs(o.vx); }
    }
    fruits=fruits.filter(o=>{
      if(o.y> BASKET_Y-24 && o.y< BASKET_Y+10 && Math.abs(o.x-basket.x)<BASKET_W/2 && eatT<=0){
        score+=o.f.p; scoreEl.textContent=score;
        floats.push({t:'+'+o.f.p, c:o.f.p>1?'#e7b62c':'#3fae6b', x:o.x, y:BASKET_Y-28, life:40});
        eatT=EAT_TIME;
        return false;
      }
      return o.y < H+40;
    });

    for(const fl of floats){ fl.y-=1; fl.life--; }
    floats=floats.filter(fl=>fl.life>0);
  }
  draw();
  raf=requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // fruits
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const o of fruits){
    ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.rot);
    ctx.font=(o.f.r*2)+'px serif'; ctx.fillText(o.f.e,0,1);
    if(o.f.p>1){ ctx.font='13px serif'; ctx.fillText('✨',o.f.r*0.7,-o.f.r*0.7); }
    ctx.restore();
  }
  // catcher face
  drawFace(basket.x,BASKET_Y);
  // eating bar
  if(running && eatT>0){
    const pct=Math.max(0,eatT)/EAT_TIME;
    ctx.fillStyle='rgba(226,104,60,.25)'; ctx.fillRect(basket.x-34,BASKET_Y-BASKET_W*0.62,68,7);
    ctx.fillStyle='#e2683c'; ctx.fillRect(basket.x-34,BASKET_Y-BASKET_W*0.62,68*pct,7);
  }
  // floats
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const fl of floats){
    ctx.globalAlpha=Math.min(1,fl.life/22);
    ctx.font='bold 20px sans-serif'; ctx.fillStyle=fl.c;
    ctx.fillText(fl.t,fl.x,fl.y); ctx.globalAlpha=1;
  }
}

function drawFace(x,y){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(eatT>0){
    const bob=Math.sin(performance.now()/70)*3;
    ctx.font=(BASKET_W*1.02)+'px serif'; ctx.fillText('😋',x,y+6+bob);
    ctx.font='bold 14px "Hiragino Maru Gothic ProN",sans-serif';
    ctx.fillStyle='#8a5c31'; ctx.fillText('もぐもぐ',x,y-BASKET_W*0.55);
  } else {
    ctx.font=(BASKET_W*1.02)+'px serif'; ctx.fillText('😮',x,y+6);
  }
  ctx.restore();
}

function end(){
  running=false; clearInterval(timerId);
  msgEl.textContent='タイムアップ！ スコア '+score+'点';
  msgEl.className='msg win';
  restartBtn.classList.add('show');
  stopMove();
}

leftBtn.addEventListener('pointerdown',e=>{e.preventDefault();requestMove(-1);});
rightBtn.addEventListener('pointerdown',e=>{e.preventDefault();requestMove(1);});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{ leftBtn.addEventListener(ev,stopMove); rightBtn.addEventListener(ev,stopMove); });
document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(e.code==='ArrowLeft'){e.preventDefault();requestMove(-1);}
  if(e.code==='ArrowRight'){e.preventDefault();requestMove(1);}
});
document.addEventListener('keyup',e=>{ if(e.code==='ArrowLeft'||e.code==='ArrowRight') stopMove(); });
startBtn.addEventListener('click',reset);
restartBtn.addEventListener('click',reset);

draw();
</script>
</body>
</html>

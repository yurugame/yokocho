<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>クレーン積み上げ</title>
<style>
  :root{
    --sky:#f4ede0; --sky2:#e8dcc6;
    --ink:#2a2320; --steel:#4a5568; --steel2:#2d3748;
    --line:#e5484d; --panel:#2a2320; --accent:#e5843b; --good:#3f9d6d;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#1a1613;color:var(--ink);
    font-family:"Trebuchet MS","Hiragino Maru Gothic ProN",sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .wrap{width:min(96vw,480px);padding:14px}
  .top{display:flex;justify-content:space-between;align-items:baseline;color:#f4ede0;margin-bottom:4px}
  h1{font-size:19px;letter-spacing:.06em;color:var(--accent)}
  .sub{color:#a8977f;font-size:11px;margin-bottom:10px}
  .hud{display:flex;justify-content:space-between;color:#f4ede0;font-size:13px;
    letter-spacing:.03em;margin-bottom:8px}
  .hud b{font-size:19px;color:var(--accent)}
  .hud .t b{color:#f4ede0}
  canvas{width:100%;display:block;border-radius:12px;
    background:linear-gradient(var(--sky),var(--sky2));
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .controls{margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
  button{font-family:inherit;font-weight:bold;border:none;border-radius:12px;
    padding:16px 0;font-size:16px;color:#f4ede0;background:#3a322b;cursor:pointer;
    transition:transform .05s,background .15s}
  button:active{transform:scale(.95)}
  .drop{background:var(--accent);color:#2a2320}
  .drop:disabled{background:#5a4a3a;color:#9a887a}
  .msg{text-align:center;color:#f4ede0;min-height:22px;margin-top:12px;font-size:15px}
  .msg.win{color:var(--good);font-size:17px}
  .msg.lose{color:var(--line);font-size:17px}
  .restart{grid-column:1/-1;background:#3a322b;margin-top:2px;display:none}
  .restart.show{display:block}
</style>
</head>
<body>
<a href="../index.html" class="__backlink" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(0,0,0,.55);color:#fff;font-family:sans-serif;font-size:13px;font-weight:bold;text-decoration:none;padding:8px 12px;border-radius:20px">&#8592; 一覧</a>
<div class="wrap">
  <div class="top"><h1>クレーン積み上げ</h1></div>
  <div class="sub">クレーンを動かして動物を落とし、赤い点線まで積み上げろ。場外に落とすと-5。</div>
  <div class="hud">
    <span>ポイント <b id="pts">50</b></span>
    <span class="t">のこり <b id="time">2:00</b></span>
    <span>高さまで <b id="gap">--</b></span>
  </div>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="left">◀ 左</button>
    <button id="right">右 ▶</button>
    <button class="drop" id="drop">落とす</button>
    <button class="restart" id="restart">もう一回</button>
  </div>
  <div class="msg" id="msg">左右で移動・落とすで投下</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Events, Composite } = Matter;

const cv = document.getElementById('c');
const W = 440, H = 560;
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

const ptsEl = document.getElementById('pts');
const timeEl = document.getElementById('time');
const gapEl = document.getElementById('gap');
const msgEl = document.getElementById('msg');
const dropBtn = document.getElementById('drop');
const restartBtn = document.getElementById('restart');

const PLATFORM_Y = H - 60;
const PLATFORM_W = 150;
const GOAL_Y = 150;              // red dashed line height
const START_POINTS = 50;
const DROP_PENALTY = 5;
const TIME_LIMIT = 120;          // seconds

const COLORS = ['#e5843b','#3f9d6d','#4a7bc4','#c65f8e','#d8b33f','#7a5cc4'];
const ANIMALS = [
  {e:'🐘', r:32, cry:'パオーン！'}, {e:'🐄', r:30, cry:'モー！'}, {e:'🐖', r:27, cry:'ブヒッ！'},
  {e:'🐑', r:26, cry:'メェ〜'}, {e:'🐢', r:26, cry:'…'}, {e:'🐧', r:25, cry:'グェッ'},
  {e:'🐰', r:24, cry:'ぴょん'}, {e:'🐱', r:24, cry:'ニャー'}, {e:'🐸', r:25, cry:'ゲロゲロ'},
  {e:'🐥', r:20, cry:'ぴよ'}, {e:'🦆', r:24, cry:'ガーガー'}, {e:'🐹', r:22, cry:'チュー'},
  {e:'🐶', r:25, cry:'ワン！'}, {e:'🐔', r:25, cry:'コケコッコー'},
];

let engine, world, runner, platform, walls;
let craneX, craneDir, held, dropping, blocks;
let points, timeLeft, running, timerId, settleFrames, won;
let cries = []; // floating cry texts

function makeBlock() {
  const a = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  const b = Bodies.circle(craneX, 70, a.r);
  b.render = { emoji: a.e, r: a.r, cry: a.cry };
  b.friction = 1; b.frictionStatic = 1; b.restitution = 0.01;
  Body.setStatic(b, true);   // held by crane until dropped
  return b;
}

function init() {
  if (runner) { Runner.stop(runner); Composite.clear(world, false); Engine.clear(engine); }
  engine = Engine.create();
  world = engine.world;
  engine.gravity.y = 1;

  platform = Bodies.rectangle(W/2, PLATFORM_Y, PLATFORM_W, 18, { isStatic:true });
  platform.render = { color:'#6b5844' };
  const postL = Bodies.rectangle(W/2 - PLATFORM_W/2 + 6, PLATFORM_Y+40, 10, 90, { isStatic:true });
  const postR = Bodies.rectangle(W/2 + PLATFORM_W/2 - 6, PLATFORM_Y+40, 10, 90, { isStatic:true });
  postL.render = postR.render = { color:'#6b5844' };
  const floorSensor = Bodies.rectangle(W/2, H+60, W*3, 40, { isStatic:true, isSensor:true });
  floorSensor.label = 'void';
  World.add(world, [platform, postL, postR, floorSensor]);

  craneX = W/2; craneDir = 0; dropping = false; blocks = []; cries = [];
  points = START_POINTS; timeLeft = TIME_LIMIT; running = true; won = false;
  settleFrames = 0;
  held = makeBlock(); World.add(world, held);
  ptsEl.textContent = points;
  updateTime();
  msgEl.textContent = '左右で移動・落とすで投下';
  msgEl.className = 'msg';
  restartBtn.classList.remove('show');
  dropBtn.disabled = false;

  runner = Runner.create();
  Runner.run(runner, engine);

  Events.on(engine, 'collisionStart', ev => {
    for (const p of ev.pairs) {
      const other = p.bodyA.label==='void' ? p.bodyB : p.bodyB.label==='void' ? p.bodyA : null;
      if (other && blocks.includes(other)) {
        World.remove(world, other);
        blocks = blocks.filter(b => b !== other);
        points -= DROP_PENALTY;
        ptsEl.textContent = points;
        flash('場外へ… -5', 'lose');
        if (points <= 0) endGame(false, 'ポイントが尽きた…');
      }
    }
  });

  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!running) return;
    timeLeft--;
    updateTime();
    if (timeLeft <= 0) endGame(false, '時間切れ！');
  }, 1000);
}

let flashTimer=null;
function flash(text, cls) {
  msgEl.textContent = text; msgEl.className = 'msg '+(cls||'');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ if(running){ msgEl.textContent='左右で移動・落とすで投下'; msgEl.className='msg'; } }, 1200);
}

function updateTime() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  timeEl.textContent = m+':'+String(s).padStart(2,'0');
}

function drop() {
  if (!running || dropping || !held) return;
  Body.setStatic(held, false);
  cries.push({ text: held.render.cry, x: held.position.x, y: held.position.y-20, life: 70 });
  blocks.push(held);
  held = null;
  dropping = true;
  dropBtn.disabled = true;
  // wait for things to settle, then give a new block
  settleFrames = 0;
}

function stackTop() {
  let top = PLATFORM_Y - 9;
  for (const b of blocks) {
    if (b.bounds.min.y < top) top = b.bounds.min.y;
  }
  return top;
}

function nearlyStill() {
  return blocks.every(b => Math.abs(b.velocity.y) < 0.4 && Math.abs(b.velocity.x) < 0.4 && Math.abs(b.angularVelocity) < 0.05);
}

// main loop: crane movement, settle detection, drawing
function loop() {
  if (running) {
    // crane movement
    if (craneDir !== 0 && held) {
      craneX += craneDir * 3.4;
      craneX = Math.max(40, Math.min(W-40, craneX));
      Body.setPosition(held, { x:craneX, y:70 });
    }
    // settle -> new block or win check
    if (dropping) {
      settleFrames = nearlyStill() ? settleFrames+1 : 0;
      if (settleFrames > 35) {
        dropping = false;
        const top = stackTop();
        gapEl.textContent = Math.max(0, Math.round(top - GOAL_Y)) + 'px';
        if (top <= GOAL_Y) {
          endGame(true, 'ゴール到達！ +残りポイント');
        } else {
          held = makeBlock(); World.add(world, held);
          craneX = W/2;
          dropBtn.disabled = false;
        }
      }
    } else if (held) {
      const top = stackTop();
      gapEl.textContent = Math.max(0, Math.round(top - GOAL_Y)) + 'px';
    }
  }
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  // goal line (red dashed)
  ctx.save();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--line').trim();
  ctx.lineWidth = 3; ctx.setLineDash([12,8]);
  ctx.beginPath(); ctx.moveTo(0, GOAL_Y); ctx.lineTo(W, GOAL_Y); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#e5484d'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('ここまで積む', 8, GOAL_Y-6);

  // crane rail + hook
  ctx.strokeStyle = '#4a5568'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(0,28); ctx.lineTo(W,28); ctx.stroke();
  if (held) {
    ctx.strokeStyle='#2d3748'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(craneX,28); ctx.lineTo(craneX, held.position.y-24); ctx.stroke();
    ctx.fillStyle='#2d3748'; ctx.fillRect(craneX-16,20,32,14);
  }

  // bodies
  const all = Composite.allBodies(world);
  for (const b of all) {
    if (b.label==='void') continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    if (b.render.emoji) {
      const size = (b.render.r || 24) * 2.2;
      ctx.font = size + 'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.render.emoji, 0, 1);
    } else if (b.render.color) {
      ctx.fillStyle = b.render.color;
      const v = b.vertices.map(p=>({x:p.x-b.position.x,y:p.y-b.position.y}));
      ctx.beginPath(); ctx.moveTo(v[0].x,v[0].y);
      for(let i=1;i<v.length;i++) ctx.lineTo(v[i].x,v[i].y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // floating cries
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const c of cries) {
    const a = Math.min(1, c.life/40);
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillStyle = '#e5484d';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    ctx.strokeText(c.text, c.x, c.y);
    ctx.fillText(c.text, c.x, c.y);
    ctx.globalAlpha = 1;
    c.y -= 0.6; c.life--;
  }
  cries = cries.filter(c => c.life > 0);
}

function endGame(win, text) {
  if (!running) return;
  running = false; won = win;
  clearInterval(timerId);
  dropBtn.disabled = true;
  if (win) {
    msgEl.textContent = `クリア！ 残り ${points}ポイントでゴール 🎉`;
    msgEl.className = 'msg win';
  } else {
    msgEl.textContent = text + ` （ポイント ${Math.max(0,points)}）`;
    msgEl.className = 'msg lose';
  }
  restartBtn.classList.add('show');
}

// controls
const L=document.getElementById('left'), R=document.getElementById('right');
function press(dir){ craneDir=dir; }
function release(){ craneDir=0; }
[['pointerdown',L,-1],['pointerdown',R,1]].forEach(([e,el,d])=>el.addEventListener(e,ev=>{ev.preventDefault();press(d);}));
['pointerup','pointerleave','pointercancel'].forEach(e=>{L.addEventListener(e,release);R.addEventListener(e,release);});
dropBtn.addEventListener('click', drop);
restartBtn.addEventListener('click', init);
document.addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.code==='ArrowLeft'){e.preventDefault();press(-1);}
  if(e.code==='ArrowRight'){e.preventDefault();press(1);}
  if(e.code==='Space'){e.preventDefault();drop();}
});
document.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='ArrowRight') release();
});

init();
loop();
</script>
</body>
</html>

<!DOCTYPE html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反射神経</title><style>*{margin:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}body{height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#12131a;color:#f5f3ef}#p{width:90vw;max-width:420px;height:60vh;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:bold;cursor:pointer;line-height:1.4;padding:20px}.wait{background:#c0392b}.go{background:#27ae60}.idle{background:#2c3e50}.res{background:#8e44ad}#b{margin-top:16px;font-size:14px;height:20px;color:#ffb03a;text-align:center}</style><body>
<a href="../index.html" class="__backlink" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(0,0,0,.55);color:#fff;font-family:sans-serif;font-size:13px;font-weight:bold;text-decoration:none;padding:8px 12px;border-radius:20px">&#8592; 一覧</a><div style="text-align:center"><div id="p" class="idle" onclick="hit()">タップで<br>スタート</div><div id="b"></div></div><script>let s="idle",t0,tm,best=0;const p=document.getElementById("p"),b=document.getElementById("b");function hit(){if(s=="idle"||s=="res"){s="wait";p.className="wait";p.innerHTML="緑になったら<br>タップ！";tm=setTimeout(go,900+Math.random()*2600)}else if(s=="wait"){clearTimeout(tm);s="res";p.className="res";p.innerHTML="早すぎ！<br>もう一回";}else if(s=="go"){const ms=Date.now()-t0;s="res";p.className="res";let m=ms<200?"神反射！":ms<300?"速い！":ms<400?"まあまあ":"のろま…";if(!best||ms<best){best=ms;m="自己ベスト！ "+m}p.innerHTML=ms+"ms<br>"+m;b.textContent="ベスト "+(best||"-")+"ms"}}function go(){s="go";t0=Date.now();p.className="go";p.innerHTML="今だ！"}</script>
